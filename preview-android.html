<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Next Score Android — Preview Interativo Moderno</title>
  <style>
    :root {
      --bg: #F3F6FA;
      --card: #FFFFFF;
      --card-goal: #ECFDF5;
      --border: #E2E8F0;
      --header-bg: #1652D0;
      --header-dark: #0F3DA6;
      --accent: #1652D0;
      --accent-cyan: #38BDF8;
      --live-red: #E11D48;
      --live-red-bg: #FFE4E6;
      --text: #0F172A;
      --text-secondary: #334155;
      --muted: #64748B;
      --subtle: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif; }
    body {
      background: linear-gradient(135deg, #E6EDF5 0%, #D8E2EE 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .phone-frame {
      width: 410px;
      height: 840px;
      background: var(--bg);
      border-radius: 40px;
      border: 10px solid #FFFFFF;
      box-shadow: 0 24px 60px rgba(15, 35, 75, 0.18), 0 4px 16px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .top-header {
      background: linear-gradient(180deg, #1856D6 0%, #134BC4 100%);
      color: #FFFFFF;
      padding: 14px 16px 14px;
      box-shadow: 0 4px 14px rgba(22, 82, 208, 0.25);
      z-index: 5;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .header-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .brand-logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: #0D3FA8;
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .brand-live-pulse-dot {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #EF4444;
      border: 1.5px solid #0D3FA8;
      animation: pulse-red 1.2s infinite;
    }
    .brand-logo-icon { font-size: 18px; }
    .brand-text-col { display: flex; flex-direction: column; }
    .brand-title-row { display: flex; align-items: center; gap: 4px; }
    .brand-title {
      color: #FFFFFF;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.8px;
      line-height: 22px;
    }
    .brand-accent {
      color: var(--accent-cyan);
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.8px;
    }
    .brand-sub {
      color: #BFDBFE;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 1px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-live-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      color: #FFFFFF;
      cursor: pointer;
      transition: all 0.2s;
    }
    .header-live-pill.active {
      background: #FFFFFF;
      color: var(--live-red);
      border-color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #EF4444;
      animation: pulse-red 1.2s infinite;
    }
    .header-live-pill.active .live-dot {
      background: var(--live-red);
    }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }
    .header-refresh-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .header-refresh-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .app-content {
      flex: 1;
      padding: 12px 14px;
      overflow-y: auto;
    }

    /* Controls Card */
    .controls-card {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .tabs-row {
      display: flex;
      background: #EEF2F6;
      padding: 3px;
      border-radius: 10px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 7px 0;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: transparent;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: 0 2px 6px rgba(22, 82, 208, 0.28);
    }
    .filter-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .filter-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: #F8FAFC;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-pill.active {
      background: #EFF6FF;
      border-color: #93C5FD;
      color: var(--accent);
    }
    .filter-pill.live.active {
      background: var(--live-red-bg);
      border-color: #FECDD3;
      color: var(--live-red);
    }

    /* League Group */
    .league-group {
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
    }
    .league-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      background: #FFFFFF;
      border-bottom: 1px solid #F1F5F9;
      border-left: 3.5px solid var(--accent);
    }
    .league-header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .league-flag { font-size: 16px; }
    .league-info { display: flex; flex-direction: column; }
    .league-name {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
    }
    .league-country {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .league-count-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      background: #EFF6FF;
      padding: 2px 7px;
      border-radius: 999px;
    }

    /* Match Row */
    .match-row {
      display: flex;
      align-items: center;
      padding: 11px 12px;
      border-bottom: 1px solid #F8FAFC;
      cursor: pointer;
      transition: background 0.15s;
    }
    .match-row:last-child { border-bottom: none; }
    .match-row:hover { background: #F8FAFC; }
    .match-time-col {
      width: 44px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }
    .match-time { font-size: 11px; font-weight: 700; color: var(--muted); }
    .match-status-live {
      font-size: 10px;
      font-weight: 800;
      color: var(--live-red);
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .match-status-live::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--live-red);
      display: inline-block;
    }
    .match-teams-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 8px;
    }
    .team-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .team-crest {
      width: 17px;
      height: 17px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: #FFFFFF;
      flex-shrink: 0;
    }
    .match-scores-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 26px;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .match-scores-col.live { color: var(--live-red); }

    /* Modal Sheet */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: flex-end;
      z-index: 30;
      backdrop-filter: blur(2px);
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      width: 100%;
      background: #FFFFFF;
      border-radius: 24px 24px 0 0;
      padding: 18px 20px 28px;
      max-height: 85%;
      overflow-y: auto;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .sheet-handle {
      width: 36px;
      height: 4px;
      background: #CBD5E1;
      border-radius: 2px;
      margin: 0 auto 14px;
    }
    .sheet-league-bar {
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
    }
    .sheet-hero-score {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 12px 6px;
      background: #F8FAFC;
      border-radius: 16px;
      border: 1px solid #E2E8F0;
      margin-bottom: 16px;
    }
    .hero-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100px;
      text-align: center;
    }
    .hero-team-crest {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .hero-team-name { font-size: 13px; font-weight: 700; color: var(--text); }
    .hero-score-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .hero-score-digits {
      font-size: 32px;
      font-weight: 900;
      color: var(--live-red);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
    }
    .hero-time-badge {
      background: var(--live-red);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .stat-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 10px;
    }
    .stat-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
    }
    .stat-bar {
      display: flex;
      height: 7px;
      border-radius: 4px;
      overflow: hidden;
      background: #E2E8F0;
      gap: 2px;
    }
    .bar-fill-left { background: var(--accent); }
    .bar-fill-right { background: var(--live-red); }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- Top Header -->
    <div class="top-header">
      <div class="status-bar">
        <span>13:45</span>
        <span>5G • 100%</span>
      </div>
      <div class="header-main">
        <div class="brand-cluster" onclick="setTab('ALL')">
          <div class="brand-logo-mark">
            <div class="brand-live-pulse-dot"></div>
            <span class="brand-logo-icon">⚽</span>
          </div>
          <div class="brand-text-col">
            <div class="brand-title-row">
              <span class="brand-title">NEXT</span>
              <span class="brand-accent">SCORE</span>
            </div>
            <span class="brand-sub">AO VIVO • FUTEBOL EM TEMPO REAL</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="header-live-pill" id="headerLiveBtn" onclick="toggleLiveFilter()">
            <span class="live-dot"></span>
            <span id="headerLiveText">3 AO VIVO</span>
          </button>
          <button class="header-refresh-btn" onclick="triggerRefresh()">
            🔄
          </button>
        </div>
      </div>
    </div>

    <!-- App Content -->
    <div class="app-content">
      <!-- Controls Card -->
      <div class="controls-card">
        <div class="tabs-row">
          <button class="tab-btn active" id="tab-ALL" onclick="setTab('ALL')">Todos</button>
          <button class="tab-btn" id="tab-FAV" onclick="setTab('FAV')">Favoritos</button>
          <button class="tab-btn" id="tab-LEAGUES" onclick="setTab('LEAGUES')">Competições</button>
        </div>
        <div class="filter-pills">
          <button class="filter-pill live active" id="filter-LIVE" onclick="setFilter('LIVE')">
            <span class="live-dot"></span> Ao Vivo (3)
          </button>
          <button class="filter-pill" id="filter-FINISHED" onclick="setFilter('FINISHED')">Finalizados</button>
          <button class="filter-pill" id="filter-UPCOMING" onclick="setFilter('UPCOMING')">Próximos</button>
        </div>
      </div>

      <!-- Matches Container -->
      <div id="matchesContainer"></div>
    </div>

    <!-- Interactive Match Detail Modal -->
    <div class="modal-backdrop" id="matchModal" onclick="closeModal(event)">
      <div class="modal-sheet" onclick="event.stopPropagation()" id="modalSheetContent"></div>
    </div>
  </div>

  <script>
    let currentTab = 'ALL';
    let currentFilter = 'LIVE';

    const matchesData = [
      {
        id: '1',
        country: 'BRASIL',
        league: 'Brasileirão Série A',
        flag: '🇧🇷',
        minute: '68\'',
        isLive: true,
        home: { name: 'Flamengo', short: 'FLA', color: '#E11D48', score: 2 },
        away: { name: 'Palmeiras', short: 'PAL', color: '#059669', score: 1 },
        stats: { poss: [58, 42], shots: [14, 8], corners: [6, 3] }
      },
      {
        id: '2',
        country: 'INGLATERRA',
        league: 'Premier League',
        flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿',
        minute: '76\'',
        isLive: true,
        home: { name: 'Manchester City', short: 'MCI', color: '#0EA5E9', score: 3 },
        away: { name: 'Liverpool', short: 'LIV', color: '#DC2626', score: 2 },
        stats: { poss: [62, 38], shots: [17, 11], corners: [8, 5] }
      },
      {
        id: '3',
        country: 'PAÍSES BAIXOS',
        league: 'KNVB Beker',
        flag: '🇳🇱',
        minute: '70\'',
        isLive: true,
        home: { name: 'Kloetinge', short: 'KLO', color: '#0284C7', score: 0 },
        away: { name: 'SC Cambuur', short: 'CAM', color: '#EAB308', score: 1 },
        stats: { poss: [40, 60], shots: [5, 12], corners: [2, 7] }
      }
    ];

    function renderMatches() {
      const container = document.getElementById('matchesContainer');
      const filtered = matchesData.filter(m => {
        if (currentFilter === 'LIVE') return m.isLive;
        return true;
      });

      container.innerHTML = filtered.map(m => `
        <div class="league-group">
          <div class="league-header">
            <div class="league-header-left">
              <span class="league-flag">${m.flag}</span>
              <div class="league-info">
                <span class="league-name">${m.league}</span>
                <span class="league-country">${m.country}</span>
              </div>
            </div>
            <span class="league-count-badge">1 JOGO</span>
          </div>
          <div class="match-row" onclick="openModal('${m.id}')">
            <div class="match-time-col">
              <span class="match-status-live">${m.minute}</span>
            </div>
            <div class="match-teams-col">
              <div class="team-line">
                <div class="team-crest" style="background:${m.home.color}">${m.home.short}</div>
                <span>${m.home.name}</span>
              </div>
              <div class="team-line">
                <div class="team-crest" style="background:${m.away.color}">${m.away.short}</div>
                <span>${m.away.name}</span>
              </div>
            </div>
            <div class="match-scores-col ${m.isLive ? 'live' : ''}">
              <span>${m.home.score}</span>
              <span>${m.away.score}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function setTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${tab}`);
      if (activeBtn) activeBtn.classList.add('active');
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`filter-${filter}`);
      if (activeBtn) activeBtn.classList.add('active');
      renderMatches();
    }

    function toggleLiveFilter() {
      if (currentFilter === 'LIVE') {
        setFilter('ALL');
        document.getElementById('headerLiveBtn').classList.remove('active');
      } else {
        setFilter('LIVE');
        document.getElementById('headerLiveBtn').classList.add('active');
      }
    }

    function triggerRefresh() {
      const btn = document.querySelector('.header-refresh-btn');
      btn.style.transform = 'rotate(360deg)';
      btn.style.transition = 'transform 0.5s ease';
      setTimeout(() => {
        btn.style.transform = 'rotate(0deg)';
        btn.style.transition = 'none';
        renderMatches();
      }, 500);
    }

    function openModal(matchId) {
      const match = matchesData.find(m => m.id === matchId);
      if (!match) return;

      const sheet = document.getElementById('modalSheetContent');
      sheet.innerHTML = `
        <div class="sheet-handle"></div>
        <div class="sheet-league-bar">${match.country} • ${match.league}</div>
        <div class="sheet-hero-score">
          <div class="hero-team">
            <div class="hero-team-crest" style="background:${match.home.color}">${match.home.short}</div>
            <span class="hero-team-name">${match.home.name}</span>
          </div>
          <div class="hero-score-center">
            <div class="hero-score-digits">${match.home.score} - ${match.away.score}</div>
            <span class="hero-time-badge">${match.minute}</span>
          </div>
          <div class="hero-team">
            <div class="hero-team-crest" style="background:${match.away.color}">${match.away.short}</div>
            <span class="hero-team-name">${match.away.name}</span>
          </div>
        </div>

        <div style="font-size:12px; font-weight:800; color:#0F172A; margin-bottom:10px;">ESTATÍSTICAS DA PARTIDA</div>
        
        <div class="stat-row">
          <div class="stat-head"><span>${match.stats.poss[0]}%</span><span>Posse de Bola</span><span>${match.stats.poss[1]}%</span></div>
          <div class="stat-bar"><div class="bar-fill-left" style="width:${match.stats.poss[0]}%"></div><div class="bar-fill-right" style="width:${match.stats.poss[1]}%"></div></div>
        </div>

        <div class="stat-row">
          <div class="stat-head"><span>${match.stats.shots[0]}</span><span>Finalizações</span><span>${match.stats.shots[1]}</span></div>
          <div class="stat-bar"><div class="bar-fill-left" style="width:${(match.stats.shots[0]/(match.stats.shots[0]+match.stats.shots[1]))*100}%"></div><div class="bar-fill-right" style="width:${(match.stats.shots[1]/(match.stats.shots[0]+match.stats.shots[1]))*100}%"></div></div>
        </div>

        <div class="stat-row">
          <div class="stat-head"><span>${match.stats.corners[0]}</span><span>Escanteios</span><span>${match.stats.corners[1]}</span></div>
          <div class="stat-bar"><div class="bar-fill-left" style="width:${(match.stats.corners[0]/(match.stats.corners[0]+match.stats.corners[1]))*100}%"></div><div class="bar-fill-right" style="width:${(match.stats.corners[1]/(match.stats.corners[0]+match.stats.corners[1]))*100}%"></div></div>
        </div>
      `;

      document.getElementById('matchModal').classList.add('open');
    }

    function closeModal(e) {
      document.getElementById('matchModal').classList.remove('open');
    }

    // Initial render
    renderMatches();
  </script>
</body>
</html>
