name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android native project (Expo Prebuild)
        env:
          CI: "1"
        run: |
          npx expo prebuild --platform android --no-install
          sed -i 's/android.enableMinifyInReleaseBuilds=true/android.enableMinifyInReleaseBuilds=false/g' android/gradle.properties
          sed -i 's/edgeToEdgeEnabled=true/edgeToEdgeEnabled=false/g' android/gradle.properties

      - name: Build signed Release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../NextScore.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextScore-apk
          path: ./NextScore.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NextScore Android APK (Latest)"
          body: "APK Android gerado automaticamente. Baixe o arquivo `NextScore.apk` abaixo para instalar no celular."
          prerelease: false
          files: ./NextScore.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
